<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars: Galactic Conquest</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Star Wars: Galactic Conquest</h1>
    <nav id="main-nav"></nav>
  </header>

  <main id="app"></main>

  <!-- Modal de detalle del Archivo Galactico -->
  <div id="archive-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="archive-modal-title" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="archive-modal-title">Detalle del asset</h2>
      </header>
      <div class="modal-body">
        <div class="archive-detail">
          <div class="detail-preview" id="detail-preview"></div>
          <dl class="detail-meta">
            <dt>Nombre</dt>
            <dd id="detail-name"></dd>
            <dt>Categoria</dt>
            <dd id="detail-category"></dd>
            <dt>Ruta</dt>
            <dd id="detail-path"></dd>
          </dl>
        </div>
      </div>
      <footer class="modal-footer">
        <button class="btn btn-primary" data-close-modal>Cerrar</button>
      </footer>
    </div>
  </div>

  <script src="js/ui/Components.js" type="module"></script>
  <script src="js/ui/Navigation.js" type="module"></script>
  <script src="js/ui/Screens.js" type="module"></script>
  <script src="js/ui/Archive.js" type="module"></script>
  <script src="js/main.js" type="module"></script>
</body>
</html>
