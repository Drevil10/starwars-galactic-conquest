<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Star Wars: Galactic Conquest</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- Pantalla de inicio -->
        <div id="start-screen" class="screen active">
            <h1>Star Wars: Galactic Conquest</h1>
            <p class="subtitle">Explora la galaxia. Construye tu imperio.</p>
            <button id="start-btn" class="primary-btn">Comenzar aventura</button>
        </div>

        <!-- Pantalla de juego -->
        <div id="game-screen" class="screen">
            <!-- Header con recursos -->
            <header id="resources-header">
                <div class="resource" id="resource-credits">
                    <span class="resource-icon">💰</span>
                    <span class="resource-value">0</span>
                </div>
                <div class="resource" id="resource-crystals">
                    <span class="resource-icon">💎</span>
                    <span class="resource-value">0</span>
                </div>
                <div class="resource" id="resource-energy">
                    <span class="resource-icon">⚡</span>
                    <span class="resource-value">0</span>
                </div>
            </header>

            <!-- Área de juego (canvas) -->
            <div id="game-area">
                <canvas id="game-canvas"></canvas>
            </div>

            <!-- Navegaci�n inferior -->
            <nav id="bottom-nav">
                <button class="nav-btn active" data-screen="base">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-label">Base</span>
                </button>
                <button class="nav-btn" data-screen="characters">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">Personajes</span>
                </button>
                <button class="nav-btn" data-screen="ships">
                    <span class="nav-icon">🚀</span>
                    <span class="nav-label">Naves</span>
                </button>
                <button class="nav-btn" data-screen="explore">
                    <span class="nav-icon">🌌</span>
                    <span class="nav-label">Explorar</span>
                </button>
                <button class="nav-btn" data-screen="missions">
                    <span class="nav-icon">📋</span>
                    <span class="nav-label">Misiones</span>
                </button>
            </nav>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/core/Constants.js"></script>
    <script src="js/core/EventBus.js"></script>
    <script src="js/core/GameState.js"></script>
    <script src="js/core/Game.js"></script>
    <script src="js/systems/ResourceManager.js"></script>
    <script src="js/systems/Renderer.js"></script>
    <script src="js/systems/Input.js"></script>
    <script src="js/systems/SaveSystem.js"></script>
    <script src="js/gameplay/Base.js"></script>
    <script src="js/gameplay/Characters.js"></script>
    <script src="js/gameplay/Ships.js"></script>
    <script src="js/ui/Screens.js"></script>
    <script src="js/ui/Navigation.js"></script>
    <script src="js/ui/Components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
