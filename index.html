<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Star Wars: Galactic Conquest</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="start-screen" class="screen active"><h1>Star Wars<br />Galactic Conquest</h1><p class="subtitle">Conquista la galaxia como el Imperio Galactico o la Alianza Rebelde</p><button id="start-btn" class="primary-btn">Comenzar</button></div>
    <div id="game-screen" class="screen">
      <header id="resources-header"><div class="resource"><span class="resource-icon">⚡</span><span class="resource-value" id="energy-res">0</span></div><div class="resource"><span class="resource-icon">🪙</span><span class="resource-value" id="credits-res">0</span></div><div class="resource"><span class="resource-icon">⛏️</span><span class="resource-value" id="minerals-res">0</span></div><div class="resource"><span class="resource-icon">🧪</span><span class="resource-value" id="research-res">0</span></div></header>
      <main id="game-area"><canvas id="game-canvas"></canvas><div id="archive-screen" class="canvas-overlay" style="display:none;"><div id="archive-list" class="archive-panel"><h2 class="archive-title">Archivo</h2><input id="archive-search" class="archive-search" type="search" placeholder="Buscar en el Archivo" /><div id="archive-filters" class="archive-filters"><button class="archive-filter active" data-type="all">Todos</button><button class="archive-filter" data-type="personaje">Personajes</button><button class="archive-filter" data-type="tecnologia">Tecnologia</button><button class="archive-filter" data-type="planeta">Planetas</button><button class="archive-filter" data-type="evento">Eventos</button></div><div id="archive-grid" class="archive-grid"></div><div id="archive-empty" class="archive-empty" style="display:none;">No hay entradas en el Archivo aun.</div></div><div id="archive-detail" class="archive-panel" style="display:none;"><img id="detail-image" class="archive-detail-image" alt="" /><h2 id="detail-title" class="archive-detail-title"></h2><div id="detail-type" class="archive-detail-type"></div><p id="detail-description" class="archive-detail-description"></p><button id="archive-back" class="action-btn archive-back-button">Volver</button></div></div></main>
      <nav id="bottom-nav"><button class="nav-btn active" data-tab="map">Mapa</button><button class="nav-btn" data-tab="build">Construir</button><button class="nav-btn" data-tab="research">Investigar</button><button class="nav-btn" data-tab="military">Militar</button><button class="nav-btn" data-tab="archive">Archivo</button><button class="nav-btn nav-menu-btn" data-tab="menu">Menu</button></nav>
    </div>
  </div>
  <script src="js/main.js"></script>
  <script src="js/archive-lore-original.js"></script><script src="js/archive-lore-sequel.js"></script><script src="js/archive-lore-legends.js"></script><script src="js/archive-lore-expanded.js"></script><script src="js/archive-lore-faction.js"></script><script src="js/archive-lore-extras.js"></script><script src="js/archive-lore-tech.js"></script><script src="js/archive-lore-planets.js"></script><script src="js/archive-lore-events.js"></script>
  <script src="js/data/map-data.js"></script>
  <script src="js/data/map-expansion.js"></script>
  <script src="js/core/map-system.js"></script>
  <script src="js/core/map-mobile-fix.js"></script>
</body>
</html>
