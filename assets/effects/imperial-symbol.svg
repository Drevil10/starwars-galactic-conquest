<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="imperialTitle imperialDesc"
>
  <title id="imperialTitle">Símbolo del Imperio Galáctico</title>
  <desc id="imperialDesc">
    Emblema imperial circular de seis radios y anillos concéntricos
  </desc>

  <!-- Cambia esta variable desde CSS:
       .imperial-logo { --imperial-color: #000; }
  -->
  <g fill="var(--imperial-color, #000000)">
    <!-- Anillo exterior: diámetro 488 px, grosor 31 px -->
    <path
      fill-rule="evenodd"
      d="
        M256 12
        A244 244 0 1 1 256 500
        A244 244 0 1 1 256 12
        Z

        M256 43
        A213 213 0 1 0 256 469
        A213 213 0 1 0 256 43
        Z
      "
    />

    <!-- Anillo interior negro -->
    <circle cx="256" cy="256" r="174" />

    <!-- Seis huecos rectangulares del anillo interior -->
    <g fill="#ffffff">
      <path d="M238 45 H274 V91 H238 Z" />
      <path d="M238 45 H274 V91 H238 Z" transform="rotate(60 256 256)" />
      <path d="M238 45 H274 V91 H238 Z" transform="rotate(120 256 256)" />
      <path d="M238 45 H274 V91 H238 Z" transform="rotate(180 256 256)" />
      <path d="M238 45 H274 V91 H238 Z" transform="rotate(240 256 256)" />
      <path d="M238 45 H274 V91 H238 Z" transform="rotate(300 256 256)" />
    </g>

    <!-- Seis radios: base exterior más ancha y unión estrecha al núcleo -->
    <g fill="#ffffff">
      <path d="M222 113 H290 L275 209 Q256 195 237 209 Z" />
      <path
        d="M222 113 H290 L275 209 Q256 195 237 209 Z"
        transform="rotate(60 256 256)"
      />
      <path
        d="M222 113 H290 L275 209 Q256 195 237 209 Z"
        transform="rotate(120 256 256)"
      />
      <path
        d="M222 113 H290 L275 209 Q256 195 237 209 Z"
        transform="rotate(180 256 256)"
      />
      <path
        d="M222 113 H290 L275 209 Q256 195 237 209 Z"
        transform="rotate(240 256 256)"
      />
      <path
        d="M222 113 H290 L275 209 Q256 195 237 209 Z"
        transform="rotate(300 256 256)"
      />

      <!-- Núcleo blanco, superpuesto para una unión limpia -->
      <circle cx="256" cy="256" r="61" />
    </g>
  </g>
</svg>
