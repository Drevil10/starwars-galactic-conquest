<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
  fill="none"
>
  <title id="title">Emblema del Imperio Galáctico</title>
  <desc id="desc">Insignia circular imperial de seis radios</desc>

  <g fill="currentColor">
    <!-- Anillo exterior -->
    <path
      fill-rule="evenodd"
      d="
        M256 18
        A238 238 0 1 0 256 494
        A238 238 0 1 0 256 18
        Z

        M256 48
        A208 208 0 1 1 256 464
        A208 208 0 1 1 256 48
        Z
      "
    />

    <!-- Cuerpo interior -->
    <circle cx="256" cy="256" r="157" />

    <!-- Huecos del anillo interior -->
    <g fill="#fff">
      <rect x="241" y="50" width="30" height="48" rx="2" />
      <rect x="241" y="414" width="30" height="48" rx="2" />

      <rect
        x="241"
        y="50"
        width="30"
        height="48"
        rx="2"
        transform="rotate(60 256 256)"
      />
      <rect
        x="241"
        y="414"
        width="30"
        height="48"
        rx="2"
        transform="rotate(60 256 256)"
      />

      <rect
        x="241"
        y="50"
        width="30"
        height="48"
        rx="2"
        transform="rotate(120 256 256)"
      />
      <rect
        x="241"
        y="414"
        width="30"
        height="48"
        rx="2"
        transform="rotate(120 256 256)"
      />
    </g>

    <!-- Seis radios blancos -->
    <g fill="#fff">
      <path d="M239 256 L223 117 L289 117 L273 256 Z" />
      <path
        d="M239 256 L223 117 L289 117 L273 256 Z"
        transform="rotate(60 256 256)"
      />
      <path
        d="M239 256 L223 117 L289 117 L273 256 Z"
        transform="rotate(120 256 256)"
      />
      <path
        d="M239 256 L223 117 L289 117 L273 256 Z"
        transform="rotate(180 256 256)"
      />
      <path
        d="M239 256 L223 117 L289 117 L273 256 Z"
        transform="rotate(240 256 256)"
      />
      <path
        d="M239 256 L223 117 L289 117 L273 256 Z"
        transform="rotate(300 256 256)"
      />

      <!-- Núcleo central -->
      <circle cx="256" cy="256" r="58" />
    </g>
  </g>
</svg>
