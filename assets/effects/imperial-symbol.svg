<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Emblema del Imperio Galáctico</title>

  <!-- Anillo exterior negro fino -->
  <circle cx="256" cy="256" r="246" fill="#000000"/>

  <!-- Espacio blanco del anillo intermedio -->
  <circle cx="256" cy="256" r="218" fill="#ffffff"/>

  <!-- Cuerpo negro interior: más grande -->
  <circle cx="256" cy="256" r="182" fill="#000000"/>

  <!-- Seis radios negros exteriores, finos -->
  <g fill="#000000">
    <path d="M246 38H266V72H246Z"/>
    <path d="M246 38H266V72H246Z" transform="rotate(60 256 256)"/>
    <path d="M246 38H266V72H246Z" transform="rotate(120 256 256)"/>
    <path d="M246 38H266V72H246Z" transform="rotate(180 256 256)"/>
    <path d="M246 38H266V72H246Z" transform="rotate(240 256 256)"/>
    <path d="M246 38H266V72H246Z" transform="rotate(300 256 256)"/>
  </g>

  <!-- Seis sectores negros exteriores gruesos -->
  <g fill="#000000">
    <path d="M217 70H295L305 124H207Z"/>
    <path d="M217 70H295L305 124H207Z" transform="rotate(60 256 256)"/>
    <path d="M217 70H295L305 124H207Z" transform="rotate(120 256 256)"/>
    <path d="M217 70H295L305 124H207Z" transform="rotate(180 256 256)"/>
    <path d="M217 70H295L305 124H207Z" transform="rotate(240 256 256)"/>
    <path d="M217 70H295L305 124H207Z" transform="rotate(300 256 256)"/>
  </g>

  <!--
    Huecos blancos interiores estrechos.
    Al ser más estrechos, dejan sectores negros
    notablemente más anchos entre cada radio.
  -->
  <g fill="#ffffff">
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z"/>
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z" transform="rotate(60 256 256)"/>
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z" transform="rotate(120 256 256)"/>
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z" transform="rotate(180 256 256)"/>
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z" transform="rotate(240 256 256)"/>
    <path d="M233 116H279L268 198L264 218Q256 212 248 218L244 198Z" transform="rotate(300 256 256)"/>

    <!-- Centro blanco más pequeño -->
    <circle cx="256" cy="256" r="54"/>
  </g>
</svg>
