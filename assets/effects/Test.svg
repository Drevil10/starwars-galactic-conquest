<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Emblema del Imperio Galáctico</title>

  <!-- Anillo exterior negro -->
  <circle cx="256" cy="256" r="246" fill="#000000"/>

  <!-- Espacio blanco entre anillo exterior y rueda interior -->
  <circle cx="256" cy="256" r="211" fill="#ffffff"/>

  <!-- Cuerpo circular negro interior -->
  <circle cx="256" cy="256" r="174" fill="#000000"/>

  <!--
    Seis radios negros exteriores pequeños.
    Van desde la cara interior del anillo exterior
    hasta los trapecios negros de la rueda.
  -->
  <g fill="#000000">
    <path d="M239 42H273V72H239Z"/>
    <path d="M239 42H273V72H239Z" transform="rotate(60 256 256)"/>
    <path d="M239 42H273V72H239Z" transform="rotate(120 256 256)"/>
    <path d="M239 42H273V72H239Z" transform="rotate(180 256 256)"/>
    <path d="M239 42H273V72H239Z" transform="rotate(240 256 256)"/>
    <path d="M239 42H273V72H239Z" transform="rotate(300 256 256)"/>
  </g>

  <!--
    Seis trapecios negros.
    Forman las conexiones gruesas entre el anillo
    y el cuerpo circular central.
  -->
  <g fill="#000000">
    <path d="M228 66H284L295 116H217Z"/>
    <path d="M228 66H284L295 116H217Z" transform="rotate(60 256 256)"/>
    <path d="M228 66H284L295 116H217Z" transform="rotate(120 256 256)"/>
    <path d="M228 66H284L295 116H217Z" transform="rotate(180 256 256)"/>
    <path d="M228 66H284L295 116H217Z" transform="rotate(240 256 256)"/>
    <path d="M228 66H284L295 116H217Z" transform="rotate(300 256 256)"/>
  </g>

  <!--
    Seis radios interiores blancos, ahora más anchos.
    El extremo exterior es ancho y se estrecha
    progresivamente al llegar al núcleo central.
  -->
  <g fill="#ffffff">
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z"/>
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z" transform="rotate(60 256 256)"/>
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z" transform="rotate(120 256 256)"/>
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z" transform="rotate(180 256 256)"/>
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z" transform="rotate(240 256 256)"/>
    <path d="M211 112H301L282 193L272 220Q256 208 240 220L230 193Z" transform="rotate(300 256 256)"/>

    <!-- Núcleo central blanco -->
    <circle cx="256" cy="256" r="63"/>
  </g>
</svg>
