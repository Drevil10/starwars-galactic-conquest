<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Emblema del Imperio Galáctico</title>

  <!-- Anillo exterior negro: más fino -->
  <circle cx="256" cy="256" r="246" fill="#000000"/>

  <!-- Hueco interior del anillo exterior -->
  <circle cx="256" cy="256" r="218" fill="#ffffff"/>

  <!-- Rueda negra central: más dominante -->
  <circle cx="256" cy="256" r="178" fill="#000000"/>

  <!-- Seis radios negros finos entre el anillo y los trapecios -->
  <g fill="#000000">
    <path d="M245 38H267V71H245Z"/>
    <path d="M245 38H267V71H245Z" transform="rotate(60 256 256)"/>
    <path d="M245 38H267V71H245Z" transform="rotate(120 256 256)"/>
    <path d="M245 38H267V71H245Z" transform="rotate(180 256 256)"/>
    <path d="M245 38H267V71H245Z" transform="rotate(240 256 256)"/>
    <path d="M245 38H267V71H245Z" transform="rotate(300 256 256)"/>
  </g>

  <!-- Seis trapecios negros gruesos -->
  <g fill="#000000">
    <path d="M222 69H290L299 121H213Z"/>
    <path d="M222 69H290L299 121H213Z" transform="rotate(60 256 256)"/>
    <path d="M222 69H290L299 121H213Z" transform="rotate(120 256 256)"/>
    <path d="M222 69H290L299 121H213Z" transform="rotate(180 256 256)"/>
    <path d="M222 69H290L299 121H213Z" transform="rotate(240 256 256)"/>
    <path d="M222 69H290L299 121H213Z" transform="rotate(300 256 256)"/>
  </g>

  <!-- Seis radios blancos interiores: más finos -->
  <g fill="#ffffff">
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z"/>
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z" transform="rotate(60 256 256)"/>
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z" transform="rotate(120 256 256)"/>
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z" transform="rotate(180 256 256)"/>
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z" transform="rotate(240 256 256)"/>
    <path d="M226 116H286L272 197L267 216Q256 208 245 216L240 197Z" transform="rotate(300 256 256)"/>

    <!-- Centro blanco: contenido para dejar más negro visible -->
    <circle cx="256" cy="256" r="57"/>
  </g>
</svg>
